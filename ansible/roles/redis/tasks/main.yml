---

- name: Create redis config from template
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis/redis.conf
    owner: redis
    group: redis
    mode: "0640"
  notify: Restart redis

- name: Start redis and enable from boot
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true
